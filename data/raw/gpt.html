<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analiz Raporu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .report-title {
            font-weight: 700;
        }

        .chart-card img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            padding: 10px;
        }

        .table thead th {
            cursor: pointer;
            user-select: none;
            vertical-align: middle;
            white-space: nowrap;
        }

        .filter-input {
            min-width: 120px;
        }

        .summary-card {
            border-radius: 12px;
        }

        .sort-icon {
            font-size: 12px;
            margin-left: 5px;
        }

        @media(max-width: 768px) {
            .chart-card img {
                height: 220px;
            }
        }
    </style>
</head>
<body>

<div class="container py-4">

    <!-- HEADER -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="bg-white shadow-sm rounded-3 p-4">
                <h1 class="report-title text-center text-primary">
                    Analiz Raporu
                </h1>
            </div>
        </div>
    </div>

    <!-- GRAFİKLER -->
    <div class="row g-4 mb-4" id="chartsContainer">
        <!-- Dinamik grafikler -->
    </div>

    <!-- TABLO -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm border-0">

                <div class="card-header bg-white">
                    <h4 class="mb-0">Sipariş Verileri</h4>
                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-bordered table-hover align-middle" id="reportTable">

                            <thead class="table-light">

                            <!-- FILTER -->
                            <tr>
                                <th>
                                    <input type="text"
                                           class="form-control form-control-sm filter-input"
                                           data-column="siparis_id"
                                           placeholder="Sipariş ID">
                                </th>

                                <th>
                                    <input type="text"
                                           class="form-control form-control-sm filter-input"
                                           data-column="musteri_adi"
                                           placeholder="Müşteri">
                                </th>

                                <th>
                                    <input type="text"
                                           class="form-control form-control-sm filter-input"
                                           data-column="sehir"
                                           placeholder="Şehir">
                                </th>

                                <th>
                                    <input type="text"
                                           class="form-control form-control-sm filter-input"
                                           data-column="fiyat"
                                           placeholder="Fiyat">
                                </th>

                                <th>
                                    <input type="text"
                                           class="form-control form-control-sm filter-input"
                                           data-column="adet"
                                           placeholder="Adet">
                                </th>

                                <th>
                                    <input type="text"
                                           class="form-control form-control-sm filter-input"
                                           data-column="tarih"
                                           placeholder="Tarih">
                                </th>

                                <th>
                                    <input type="text"
                                           class="form-control form-control-sm filter-input"
                                           data-column="kategori"
                                           placeholder="Kategori">
                                </th>

                                <th>
                                    <input type="text"
                                           class="form-control form-control-sm filter-input"
                                           data-column="toplam"
                                           placeholder="Toplam">
                                </th>
                            </tr>

                            <!-- HEADER -->
                            <tr>
                                <th onclick="sortTable('siparis_id')">
                                    Sipariş ID
                                    <span class="sort-icon" id="sort-siparis_id"></span>
                                </th>

                                <th onclick="sortTable('musteri_adi')">
                                    Müşteri Adı
                                    <span class="sort-icon" id="sort-musteri_adi"></span>
                                </th>

                                <th onclick="sortTable('sehir')">
                                    Şehir
                                    <span class="sort-icon" id="sort-sehir"></span>
                                </th>

                                <th onclick="sortTable('fiyat')">
                                    Fiyat
                                    <span class="sort-icon" id="sort-fiyat"></span>
                                </th>

                                <th onclick="sortTable('adet')">
                                    Adet
                                    <span class="sort-icon" id="sort-adet"></span>
                                </th>

                                <th onclick="sortTable('tarih')">
                                    Tarih
                                    <span class="sort-icon" id="sort-tarih"></span>
                                </th>

                                <th onclick="sortTable('kategori')">
                                    Kategori
                                    <span class="sort-icon" id="sort-kategori"></span>
                                </th>

                                <th onclick="sortTable('toplam')">
                                    Toplam
                                    <span class="sort-icon" id="sort-toplam"></span>
                                </th>
                            </tr>

                            </thead>

                            <tbody id="tableBody">
                            <!-- Dinamik veri -->
                            </tbody>

                        </table>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- ÖZET -->
    <div class="row mt-4 g-4">

        <div class="col-md-4">
            <div class="card summary-card shadow-sm border-0">
                <div class="card-body text-center">
                    <h6 class="text-muted">Toplam Sipariş Sayısı</h6>
                    <h3 id="totalOrders">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card summary-card shadow-sm border-0">
                <div class="card-body text-center">
                    <h6 class="text-muted">Toplam Satış Tutarı</h6>
                    <h3 id="totalSales">0 ₺</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card summary-card shadow-sm border-0">
                <div class="card-body text-center">
                    <h6 class="text-muted">Ortalama Sipariş Tutarı</h6>
                    <h3 id="averageSales">0 ₺</h3>
                </div>
            </div>
        </div>

    </div>

</div>

<script>

    // API URL
    const API_URL = "http://localhost:8000/ml/report";

    let originalData = [];
    let filteredData = [];
    let currentSort = {
        column: null,
        direction: "asc"
    };

    // SAYI FORMAT
    function formatCurrency(value) {
        return new Intl.NumberFormat('tr-TR', {
            style: 'currency',
            currency: 'TRY'
        }).format(value || 0);
    }

    // API VERİLERİNİ GETİR
    async function fetchReport() {

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("API verisi alınamadı");
            }

            const result = await response.json();

            renderCharts(result.grafikler || []);

            originalData = result.data || [];
            filteredData = [...originalData];

            renderTable(filteredData);
            renderSummary(filteredData);

        } catch (error) {

            console.error(error);

            document.body.innerHTML = `
                <div class="container py-5">
                    <div class="alert alert-danger">
                        Veri alınırken hata oluştu:
                        ${error.message}
                    </div>
                </div>
            `;
        }
    }

    // GRAFİKLERİ OLUŞTUR
    function renderCharts(charts) {

        const container = document.getElementById("chartsContainer");

        container.innerHTML = "";

        charts.forEach(chart => {

            const col = document.createElement("div");
            col.className = "col-lg-4 col-md-6";

            col.innerHTML = `
                <div class="card chart-card shadow-sm border-0 h-100">
                    <div class="card-header bg-white">
                        <h6 class="mb-0 text-truncate">
                            ${chart}
                        </h6>
                    </div>

                    <div class="card-body d-flex align-items-center justify-content-center">
                        <img src="http://localhost:8000/ml/images/${chart}"
                             alt="${chart}">
                    </div>
                </div>
            `;

            container.appendChild(col);

        });
    }

    // TABLOYU OLUŞTUR
    function renderTable(data) {

        const tbody = document.getElementById("tableBody");

        tbody.innerHTML = "";

        data.forEach(item => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${item.siparis_id ?? ""}</td>
                <td>${item.musteri_adi ?? ""}</td>
                <td>${item.sehir ?? ""}</td>
                <td>${formatCurrency(item.fiyat)}</td>
                <td>${item.adet ?? ""}</td>
                <td>${item.tarih ?? "-"}</td>
                <td>${item.kategori ?? ""}</td>
                <td>${formatCurrency(item.toplam)}</td>
            `;

            tbody.appendChild(row);

        });
    }

    // ÖZET BİLGİLER
    function renderSummary(data) {

        const totalOrders = data.length;

        const totalSales = data.reduce((sum, item) => {
            return sum + (item.toplam || 0);
        }, 0);

        const averageSales =
            totalOrders > 0
                ? totalSales / totalOrders
                : 0;

        document.getElementById("totalOrders").innerText =
            totalOrders;

        document.getElementById("totalSales").innerText =
            formatCurrency(totalSales);

        document.getElementById("averageSales").innerText =
            formatCurrency(averageSales);
    }

    // FILTER
    function applyFilters() {

        const filters = {};

        document.querySelectorAll(".filter-input")
            .forEach(input => {

                filters[input.dataset.column] =
                    input.value.toLowerCase().trim();

            });

        filteredData = originalData.filter(item => {

            return Object.keys(filters).every(key => {

                if (!filters[key]) {
                    return true;
                }

                const value = String(item[key] ?? "")
                    .toLowerCase();

                return value.includes(filters[key]);

            });

        });

        renderTable(filteredData);
        renderSummary(filteredData);
    }

    // FILTER EVENT
    document.addEventListener("input", function (e) {

        if (e.target.classList.contains("filter-input")) {
            applyFilters();
        }

    });

    // SIRALAMA
    function sortTable(column) {

        if (currentSort.column === column) {

            currentSort.direction =
                currentSort.direction === "asc"
                    ? "desc"
                    : "asc";

        } else {

            currentSort.column = column;
            currentSort.direction = "asc";
        }

        filteredData.sort((a, b) => {

            let valueA = a[column];
            let valueB = b[column];

            // NULL kontrolü
            if (valueA == null) valueA = "";
            if (valueB == null) valueB = "";

            // Number kontrolü
            const isNumber =
                !isNaN(valueA) && !isNaN(valueB);

            if (isNumber) {

                valueA = Number(valueA);
                valueB = Number(valueB);

            } else {

                valueA = valueA.toString().toLowerCase();
                valueB = valueB.toString().toLowerCase();
            }

            if (valueA < valueB) {
                return currentSort.direction === "asc"
                    ? -1
                    : 1;
            }

            if (valueA > valueB) {
                return currentSort.direction === "asc"
                    ? 1
                    : -1;
            }

            return 0;

        });

        updateSortIcons();

        renderTable(filteredData);
    }

    // SIRALAMA İKONLARI
    function updateSortIcons() {

        document.querySelectorAll(".sort-icon")
            .forEach(icon => {
                icon.innerHTML = "";
            });

        if (currentSort.column) {

            const icon =
                document.getElementById(
                    `sort-${currentSort.column}`
                );

            icon.innerHTML =
                currentSort.direction === "asc"
                    ? "▲"
                    : "▼";
        }
    }

    // BAŞLAT
    fetchReport();

</script>

</body>
</html>
